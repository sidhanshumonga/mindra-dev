name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Build first: @mindra.dev/react resolves core's types through its built
      # dist, so typecheck cannot pass on a fresh clone until core is built.
      # The build also asserts that the "use client" directive survives
      # bundling, failing loudly rather than shipping a package the App Router
      # would reject.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify tarball contents
        run: |
          for pkg in core react; do
            echo "--- @mindra/$pkg ---"
            ( cd "packages/$pkg" && npm pack --dry-run )
          done
      - name: Fail if tests or sources would be published
        run: |
          for pkg in core react; do
            if ( cd "packages/$pkg" && npm pack --dry-run 2>&1 ) | grep -qE "(test/|src/|\.env)"; then
              echo "::error::@mindra/$pkg tarball contains files that must not be published"
              exit 1
            fi
          done
